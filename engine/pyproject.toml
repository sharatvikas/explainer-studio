[project]
name = "studio"
version = "0.2.0"
description = "Explainer Studio engine: specs to animated explainer videos"
requires-python = ">=3.12,<3.13"
dependencies = [
  "manim>=0.19", "matplotlib>=3.8", "kokoro-onnx>=0.4", "soundfile", "numpy", "scipy",
  "pydantic>=2.6", "sympy>=1.12", "pypdf>=4", "python-docx>=1.1", "python-pptx>=0.6.23",
  "pillow>=10", "imageio-ffmpeg>=0.5", "av>=12",
]

[project.scripts]
studio = "studio.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.pytest.ini_options]
markers = ["slow: renders video (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning:pydub.*"]
